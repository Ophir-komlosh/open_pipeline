version: "3.9"

services:
  middleware:
    build:
      context: ./middleware
    container_name: middleware
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./middleware:/app
    restart: always

  webui:
    image: ghcr.io/open-webui/open-webui:0.6.5
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=http://middleware:8000/v1
    depends_on:
      - middleware
    restart: always

volumes:
  open-webui: